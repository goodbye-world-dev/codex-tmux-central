set -g mouse on
set -g history-limit 50000
set -g status-position bottom
set -g status-interval 1
set -g status-style 'bg=colour235,fg=colour250'
set -g status-left-length 30
set -g status-right-length 30
set -g status-left '#[bold,fg=colour81] #S '
set -g status-right '#[fg=colour244]%Y-%m-%d %H:%M '

setw -g window-status-separator ''
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'
setw -g window-status-format '#[fg=colour245] #I:#W #{@codex_status}#{@codex_agents_label} '
setw -g window-status-current-format '#[bold,bg=colour238,fg=colour255] #I:#W #{@codex_status}#{@codex_agents_label} '

# Ctrl-b + Left/Right switches between Codex windows.
bind Left previous-window
bind Right next-window
